<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد روابط واتساب الإحترافي - تصميم م. محمد صبحي</title>
<!-- 1. مكتبة Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- 2. مكتبة PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
<!-- 3. مكتبة Word -->
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.min.js"></script>

<style>
  body {
    font-family: 'Cairo', sans-serif;
    margin: 20px;
    background-color: #f0f0f0;
    color: #000000;
    text-align: center;
  }
  .signature {
    font-size: 24px;
    font-weight: bold;
    color: #00bfff;
    text-shadow: 0 0 8px rgba(0, 191, 255, 0.8), 0 0 12px rgba(255, 255, 0, 0.5);
    padding: 15px 0;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background-color: #ffffff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  h2 {
    color: #333;
  }
  label {
      display: block;
      text-align: right;
      margin-bottom: 5px;
      font-weight: bold;
  }
  textarea, input, select {
    width: calc(100% - 22px);
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 16px;
    font-family: inherit;
  }
  textarea {
    height: 120px;
    resize: vertical;
  }
  .main-buttons button, .file-upload-btn {
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
    transition: transform 0.2s;
    display: inline-block;
  }
  .main-buttons button:hover, .file-upload-btn:hover {
      transform: scale(1.05);
  }
  #generateBtn { background-color: #1E90FF; }
  #downloadTxtBtn { background-color: #32CD32; }
  #downloadCsvBtn { background-color: #FF8C00; }
  #saveMsgBtn { background-color: #6a5acd; }
  .file-upload-btn { background-color: #5bc0de; }
  #file-input { display: none; }

  #resultsTable {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
  }
  #resultsTable th, #resultsTable td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
  }
  #resultsTable th {
    background-color: #f2f2f2;
  }
  .whatsapp-btn {
    padding: 8px 15px;
    background-color: #25D366;
    border: none;
    border-radius: 5px;
    color: white !important;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background-color 0.3s;
  }
  .whatsapp-btn:hover {
    background-color: #128C7E;
  }
  .invalid-number {
    background-color: #ffdddd;
    color: #d8000c;
  }
  .invalid-number .whatsapp-btn {
      background-color: #aaa;
      pointer-events: none;
      cursor: not-allowed;
  }
  .progress-container {
      width: 100%;
      background-color: #ddd;
      border-radius: 5px;
      margin-top: 15px;
      display: none;
  }
  .progress-bar {
      width: 0%;
      height: 20px;
      background-color: #4CAF50;
      text-align: center;
      line-height: 20px;
      color: white;
      border-radius: 5px;
      transition: width 0.1s;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body onload="loadSavedMessages()">

<header class="signature">
  ✨ تصميم م. محمد صبحي ✨
</header>

<div class="container">
  <h2>مولد روابط واتساب الإحترافي</h2>

  <label for="file-input" class="file-upload-btn">📤 رفع ملف (Excel, Word, PDF)</label>
  <input type="file" id="file-input" accept=".xlsx, .xls, .csv, .doc, .docx, .pdf" onchange="handleFile(event)">

  <label for="numbers">📱 أرقام الهواتف (كل رقم في سطر):</label>
  <textarea id="numbers" placeholder="سيتم وضع الأرقام المستخرجة هنا، أو يمكنك إضافتها يدويًا..."></textarea>

  <label for="countryCode">🌍 كود الدولة (مثال: 20):</label>
  <input type="text" id="countryCode" placeholder="مثال: 20 لمصر">

  <label for="message">💬 نص الرسالة:</label>
  <textarea id="message" placeholder="اكتب رسالتك هنا..."></textarea>
  
  <label for="savedMessages">✉️ اختر رسالة محفوظة:</label>
  <select id="savedMessages" onchange="useSavedMessage()">
      <option value="">-- لا يوجد رسائل محفوظة --</option>
  </select>

  <div class="main-buttons">
    <button id="generateBtn" onclick="generateLinks()">🚀 توليد الروابط</button>
    <button id="saveMsgBtn" onclick="saveMessage()">💾 حفظ الرسالة الحالية</button>
    <button id="downloadTxtBtn" onclick="downloadResults('txt')">💾 تحميل (TXT)</button>
    <button id="downloadCsvBtn" onclick="downloadResults('csv')">📊 تحميل (CSV)</button>
  </div>

  <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar">0%</div>
  </div>

  <table id="resultsTable" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>الرقم الكامل</th>
        <th>الحالة</th>
        <th>إرسال</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<footer class="signature">
  ⚡ Created by ENG. Mohamed Sobhy ⚡
</footer>

<script>
// --- معالجة الملفات ---
async function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    const fileExtension = file.name.split('.').pop().toLowerCase();

    reader.onload = async function(e) {
        const fileData = e.target.result;
        let allText = '';

        try {
            if (['xlsx', 'xls', 'csv'].includes(fileExtension)) {
                const workbook = XLSX.read(new Uint8Array(fileData), {type: 'array'});
                workbook.SheetNames.forEach(sheetName => {
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, defval: '' });
                    jsonData.forEach(row => { allText += row.join(' ') + '\n'; });
                });
                extractAndDisplayNumbers(allText);

            } else if (['docx'].includes(fileExtension)) {
                // الطريقة الصحيحة لاستخدام docx-preview
                // المكتبة تحتاج إلى عنصر وهمي في الصفحة لتعمل
                const dummyElement = document.createElement('div');
                await docx.renderAsync(fileData, dummyElement);
                allText = dummyElement.innerText;
                extractAndDisplayNumbers(allText);

            } else if (fileExtension === 'pdf') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js`;
                const pdf = await pdfjsLib.getDocument({data: new Uint8Array(fileData)}).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    textContent.items.forEach(item => { allText += item.str + ' '; });
                    allText += '\n';
                }
                extractAndDisplayNumbers(allText);

            } else {
                alert('نوع الملف غير مدعوم. يرجى رفع ملف Excel, Word, أو PDF.');
            }
        } catch (error) {
            console.error("خطأ في قراءة الملف:", error);
            alert("حدث خطأ أثناء محاولة قراءة الملف. قد يكون الملف تالفًا أو محميًا.");
        }
    };

    reader.readAsArrayBuffer(file);
    event.target.value = '';
}

function extractAndDisplayNumbers(text) {
    const phoneRegex = /(\+?\d{1,4}[\s-.]?)?\(?\d{2,4}\)?[\s-.]?\d{2,4}[\s-.]?\d{2,9}/g;
    const foundNumbers = text.match(phoneRegex) || [];
    
    const cleanedNumbers = foundNumbers.map(num => num.replace(/\D/g, ''));
    const uniqueNumbers = [...new Set(cleanedNumbers)].filter(n => n.length >= 7);
    
    const numbersTextarea = document.getElementById('numbers');
    const existingNumbers = new Set(numbersTextarea.value.split('\n').filter(Boolean));
    uniqueNumbers.forEach(num => existingNumbers.add(num));
    
    numbersTextarea.value = Array.from(existingNumbers).join('\n');
    
    alert(`تم العثور على ${uniqueNumbers.length} رقم هاتف جديد. الإجمالي الآن ${existingNumbers.size} رقم.`);
}


// --- باقي الدوال تبقى كما هي ---
const SAVED_MESSAGES_KEY = 'whatsappGeneratorSavedMessages';

function loadSavedMessages() {
    const messages = JSON.parse(localStorage.getItem(SAVED_MESSAGES_KEY) || '[]');
    const select = document.getElementById('savedMessages');
    select.innerHTML = '<option value="">-- اختر رسالة --</option>';
    if (messages.length > 0) {
        messages.forEach((msg, index) => {
            const option = document.createElement('option');
            option.value = msg;
            option.textContent = `رسالة ${index + 1}: ${msg.substring(0, 30)}...`;
            select.appendChild(option);
        });
    } else {
        select.innerHTML = '<option value="">-- لا يوجد رسائل محفوظة --</option>';
    }
}

function saveMessage() {
    const message = document.getElementById('message').value.trim();
    if (!message) {
        alert('لا يمكن حفظ رسالة فارغة.');
        return;
    }
    let messages = JSON.parse(localStorage.getItem(SAVED_MESSAGES_KEY) || '[]');
    if (messages.includes(message)) {
        alert('هذه الرسالة محفوظة بالفعل.');
        return;
    }
    messages.push(message);
    localStorage.setItem(SAVED_MESSAGES_KEY, JSON.stringify(messages));
    alert('تم حفظ الرسالة بنجاح!');
    loadSavedMessages();
}

function useSavedMessage() {
    const select = document.getElementById('savedMessages');
    const message = select.value;
    if (message) {
        document.getElementById('message').value = message;
    }
}

async function generateLinks() {
  const numbersInput = document.getElementById('numbers').value.trim();
  const countryCode = document.getElementById('countryCode').value.trim().replace('+', '');
  const message = encodeURIComponent(document.getElementById('message').value.trim());
  
  if (!numbersInput || !countryCode) {
    alert('يرجى إدخال أرقام الهواتف وكود الدولة.');
    return;
  }

  const numbers = numbersInput.split(/\s+/).filter(n => n);
  
  if (numbers.length === 0) {
      alert('لم يتم إدخال أرقام صالحة.');
      return;
  }

  const table = document.getElementById('resultsTable');
  const tbody = table.querySelector('tbody');
  tbody.innerHTML = '';
  
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  progressContainer.style.display = 'block';
  progressBar.style.width = '0%';
  progressBar.textContent = '0%';

  for (let i = 0; i < numbers.length; i++) {
    const num = numbers[i];
    const cleanNum = num.replace(/\D/g, '').replace(/^0+/, '');
    const isValid = cleanNum.length >= 7 && cleanNum.length <= 13;
    const fullNumber = countryCode + cleanNum;
    const whatsappLink = `https://wa.me/${fullNumber}?text=${message}`;

    const row = tbody.insertRow();
    row.className = isValid ? '' : 'invalid-number';
    
    row.innerHTML = `
      <td>${i + 1}</td>
      <td>${fullNumber}</td>
      <td>${isValid ? 'صالح' : 'غير صالح'}</td>
      <td><a href="${whatsappLink}" target="_blank" class="whatsapp-btn">${isValid ? 'أرسل' : 'معطل'}</a></td>
    `;

    const percent = Math.round(((i + 1) / numbers.length) * 100);
    progressBar.style.width = percent + '%';
    progressBar.textContent = percent + '%';
    
    if ((i + 1) % 50 === 0) {
        await new Promise(resolve => setTimeout(resolve, 0));
    }
  }

  table.style.display = 'table';
}

function downloadResults(format) {
  const tableBody = document.getElementById('resultsTable').querySelector('tbody');
  if (tableBody.rows.length === 0) {
    alert('يرجى توليد الروابط أولاً قبل محاولة التحميل.');
    return;
  }

  let content = '';
  let mimeType = '';
  let fileExtension = '';

  if (format === 'csv') {
    content = 'الرقم,الحالة,الرابط\n';
    mimeType = 'text/csv;charset=utf-8;';
    fileExtension = 'csv';
    for (const row of tableBody.rows) {
      const number = row.cells[1].textContent;
      const status = row.cells[2].textContent;
      const link = row.cells[3].querySelector('a').href;
      content += `"${number}","${status}","${link}"\n`;
    }
  } else {
    content = 'الرقم\tالحالة\tالرابط\n\n';
    mimeType = 'text/plain;charset=utf-8;';
    fileExtension = 'txt';
    for (const row of tableBody.rows) {
      const number = row.cells[1].textContent;
      const status = row.cells[2].textContent;
      const link = row.cells[3].querySelector('a').href;
      content += `${number}\t${status}\t${link}\n`;
    }
  }

  const blob = new Blob([`\uFEFF${content}`], { type: mimeType });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `whatsapp_links.${fileExtension}`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>

</body>
</html>
